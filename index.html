  REM.items.push(it); remSave(); renderRems();
  toast("Reminder set · " + remWhen(it.due));
  return it;
}
function remDone(id){
  const it = REM.items.find(x => x.id === id); if (!it) return;
  const copy = JSON.parse(JSON.stringify(it)), h = RL.complete(it, remNow());
  REM.hist = [h].concat(REM.hist || []).slice(0, 60);
  remSave(); renderRems(); updateAppBadge(); if (typeof renderToday === "function") renderToday();
  undoToast(it.done ? "Done: " + copy.title : "Next: " + remWhen(it.due), () => {
    Object.assign(it, copy, { u:Date.now(), done:false, doneAt:null }); REM.hist = REM.hist.filter(x => x.id !== h.id); remSave(); renderRems();
  });
}
function remDelete(it){
  const idx = REM.items.indexOf(it); if (idx < 0) return;
  REM.items.splice(idx, 1); REM.del[it.id] = Date.now(); remSave(); renderRems();
  undoToast("Deleted " + it.title, () => { it.u = Date.now() + 1; REM.items.splice(idx, 0, it); remSave(); renderRems(); });
}

const REP_OPTS = [["none","Doesn't repeat"],["daily","Every day"],["weekdays","Weekdays (Mon–Fri)"],["weekly","Weekly"],["ndays","Every few days"],["monthly","Monthly"],["yearly","Every year"]];
const EARLY_OPTS = [[0,"No early alert"],[15,"15 minutes before"],[60,"1 hour before"],[1440,"1 day before"]];
function editRem(id, pre, back){
  const it = id ? REM.items.find(x => x.id === id) : null;
  const base = it || Object.assign({ title:"", due:null, rep:{ f:"none" }, early:0, nag:false, hi:false, list: back || "general" }, pre || {});
  const curList = it ? remListOf(it) : (base.list || "general");
  const now = remNow(), dflt = base.due || RL.addMin(now.slice(0,13) + ":00", 60);
  const r = base.rep || { f:"none" };
  let days = (r.days && r.days.length) ? r.days.slice() : [RL.dow(dflt)];
  const endMode = r.end ? "date" : r.count ? "count" : "never";
  const DL = ["S","M","T","W","T","F","S"];
  menu.innerHTML = `<div class="mt">${it ? "Edit reminder" : "New reminder"}</div>
    <form class="ed rform" id="rf" style="padding-top:0">
      ${it && it.notes && remLinks(it.notes) ? `<div class="rlinks">${remLinks(it.notes)}</div>` : ""}
      <label>Remind me to</label><input id="rT" value="${esc(base.title)}" placeholder="e.g. Pay rego" autocomplete="off">
      <label>List</label><select class="set-sel" id="rL">${REM.lists.map(l => `<option value="${l.id}" ${l.id === curList ? "selected" : ""}>${l.icon} ${esc(l.name)}</option>`).join("")}</select>
      <div class="r2"><div><label>Date</label><input id="rD" type="date" value="${dflt.slice(0,10)}"></div><div><label>Time</label><input id="rH" type="time" value="${dflt.slice(11,16)}"></div></div>
      <label>Repeat</label><select class="set-sel" id="rR">${REP_OPTS.map(([v,l]) => `<option value="${v}" ${r.f === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <div id="rWk" class="rdays">${[1,2,3,4,5,6,0].map(d => `<button type="button" data-wd="${d}" class="${days.indexOf(d) >= 0 ? "on" : ""}">${DL[d]}</button>`).join("")}</div>
      <div id="rN" class="r2"><div><label id="rNl">Every how many days?</label><input id="rNv" type="number" min="1" max="365" inputmode="numeric" value="${r.n || (r.f === "monthly" ? 1 : 2)}"></div></div>
      <div id="rEnd"><label>Ends</label><div class="r2"><div><select class="set-sel" id="rE"><option value="never">Never</option><option value="date" ${endMode === "date" ? "selected" : ""}>On a date</option><option value="count" ${endMode === "count" ? "selected" : ""}>After a number of times</option></select></div>
        <div><input id="rEd" type="date" value="${r.end || ""}"><input id="rEc" type="number" min="1" inputmode="numeric" placeholder="Times" value="${r.count || ""}"></div></div></div>
      <label>Notes</label><textarea id="rNo" rows="2" placeholder="Phone number, link or details — they become tappable">${esc(base.notes || "")}</textarea>
      <label>Early alert</label><select class="set-sel" id="rEa">${EARLY_OPTS.map(([v,l]) => `<option value="${v}" ${+base.early === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label class="rtog"><input type="checkbox" id="rNag" ${base.nag ? "checked" : ""}><span>Keep reminding every 15 min until done</span></label>
      <label class="rtog"><input type="checkbox" id="rHi" ${base.hi ? "checked" : ""}><span>Important (high-priority alert)</span></label>
      <div class="rhint" id="rHint"></div>
      ${it ? `<div class="r3"><button type="button" id="rDo">✓ Done</button><button type="button" id="rSn">💤 1 hour</button><button type="button" id="rDel" class="del">Delete</button></div>` : ""}
      <div class="acts"><button type="submit" class="save">${it ? "Save" : "Add reminder"}</button></div>
    </form>`;
  const $ = s => menu.querySelector(s);
  const sync = () => {
    const f = $("#rR").value;
    $("#rWk").style.display = f === "weekly" ? "" : "none";
    $("#rN").style.display = f === "ndays" || f === "monthly" ? "" : "none";
    $("#rNl").textContent = f === "monthly" ? "Every how many months?" : "Every how many days?";
    $("#rEnd").style.display = f === "none" ? "none" : "";
    $("#rEd").style.display = $("#rE").value === "date" ? "" : "none";
    $("#rEc").style.display = $("#rE").value === "count" ? "" : "none";
    const tmp = collect(true);
    $("#rHint").textContent = tmp && tmp.due ? (tmp.due <= remNow() && !it ? "⚠️ That time has already passed" : "⏰ " + remWhen(tmp.due) + (RL.repeats(tmp) ? " · 🔁 " + RL.repText(tmp) : "")) : "";
  };
  function collect(quiet){
    const title = $("#rT").value.trim(), d = $("#rD").value, h = $("#rH").value || "09:00", f = $("#rR").value;
    if (!d){ if (!quiet) toast("Pick a date"); return null; }
    const rep = { f };
    if (f === "weekly") rep.days = days.slice();
    if (f === "ndays" || f === "monthly") rep.n = Math.max(1, +$("#rNv").value || 1);
    if (f !== "none"){
      const em = $("#rE").value;
      if (em === "date" && $("#rEd").value) rep.end = $("#rEd").value;
      if (em === "count" && +$("#rEc").value > 0){ rep.count = +$("#rEc").value; if (it && it.rep && it.rep.count === rep.count) rep.left = it.rep.left; }
    }
    let due = d + "T" + h;
    if (f === "weekly" && rep.days.length && rep.days.indexOf(RL.dow(due)) < 0){ let x = due; for (let i = 0; i < 7; i++){ x = RL.addMin(x, 1440); if (rep.days.indexOf(RL.dow(x)) >= 0) break; } due = x; }
    if (f === "weekdays") while (RL.dow(due) === 0 || RL.dow(due) === 6) due = RL.addMin(due, 1440);
    return { title, due, rep, list:$("#rL").value, notes:$("#rNo").value.trim(), early:+$("#rEa").value, nag:$("#rNag").checked, hi:$("#rHi").checked };
  }
  menu.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => {
    const d = +b.dataset.wd, i = days.indexOf(d);
    if (i >= 0){ if (days.length > 1) days.splice(i, 1); } else days.push(d);
    menu.querySelectorAll("[data-wd]").forEach(x => x.classList.toggle("on", days.indexOf(+x.dataset.wd) >= 0)); sync();
  });
  ["#rR","#rE","#rD","#rH","#rNv","#rEd","#rEc"].forEach(s => { $(s).addEventListener("input", sync); $(s).addEventListener("change", sync); });
  sync();
  $("#rf").onsubmit = e => {
    e.preventDefault();
    const v = collect(false); if (!v) return;
    if (!v.title){ $("#rT").focus(); return; }
    if (it){
      const moved = v.due !== it.due || JSON.stringify(v.rep) !== JSON.stringify(it.rep);
      Object.assign(it, v, { u:Date.now() });
      if (moved){ it.snooze = null; it.anchor = v.due; it.done = false; }
      remSave(); renderRems(); remBack(back);
    } else { const n = remAdd(v); if (v.notes){ n.notes = v.notes; remSave(); } remBack(back); }
  };
  if (it){
    const after = () => remBack(back);
    $("#rDo").onclick = () => { remDone(it.id); after(); };
    $("#rSn").onclick = () => { RL.snooze(it, remNow(), 60); remSave(); renderRems(); after(); toast("Snoozed until " + remHM(it.snooze)); };
    $("#rDel").onclick = () => { remDelete(it); after(); };
  }
  openMenu();
  if (!it && !base.title) setTimeout(() => $("#rT").focus(), 60);
}

/* ---- Home Base notifications (Web Push) on this phone ---- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const standaloneApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const urlB64 = s => { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
function pushBox(host){
  if (!host) return;
  let state, btn = "";
  if (!pushSupported()) state = standaloneApp() ? "This iPhone needs iOS 16.4 or newer for Home Base notifications." : "Open Home Base from its <b>Home Screen icon</b> (not Safari) to turn on notifications.";
  else if (Notification.permission === "denied") state = "Notifications are blocked for Home Base. Turn them on in iPhone <b>Settings → Notifications → Home Base</b>, then come back here.";
  else if (Notification.permission === "granted" && LOCAL.pushOn) { state = "✅ Notifications are on for this phone."; btn = `<button class="rbtn ghost" id="rPushRe">Refresh this phone's notification link</button>`; }
  else { state = ""; btn = `<button class="rbtn" id="rPush">🔔 Turn on notifications</button>`; }
  host.innerHTML = (state ? `<div class="rnote" style="margin:0 0 4px;color:var(--ink)">${state}</div>` : "") + btn;
  const b = host.querySelector("#rPush") || host.querySelector("#rPushRe");
  if (b) b.onclick = async () => { b.disabled = true; b.textContent = "Turning on…"; await enablePush(); pushBox(host); };
}
async function enablePush(){
  try {
    if (!LOCAL.url){ toast("Connect your Google script first (⚙︎ → Sync)"); return false; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ toast("Notifications weren't allowed"); return false; }
    const reg = await navigator.serviceWorker.ready;
    const k = await api({ doc:"house", key:keyFor(), op:"pushKey" });
    if (!k || !k.ok){ toast(k && k.error === "unknown op" ? "Update your Google script first" : "Couldn't get the notification key"); return false; }
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey){
      const cur = btoa(String.fromCharCode.apply(null, new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      if (cur !== k.key){ await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(k.key) });
    const r = await apiPost({ doc:"house", key:keyFor(), op:"pushSub", who:whoAmI(), sub:JSON.stringify(sub) });
    if (!r || !r.ok){ toast("Couldn't save: " + ((r && r.error) || "no reply")); return false; }
    LOCAL.pushOn = 1; saveLocal();
    toast("Notifications are on 🔔"); updateAppBadge(); renderRems();
    return true;
  } catch(e){ toast("Couldn't turn on notifications: " + e.message); return false; }
}
/* The number on the Home Base icon: overdue reminders plus bills due within 3 days. */
function appBadgeCount(){
  let n = 0;
  try { const now = remNow(); n += remOpen().filter(it => RL.at(it) <= now).length; } catch(e){}
  try { n += (REM.routines || []).filter(rtLate).length; } catch(e){}
  try { if (typeof BB !== "undefined" && typeof bbUnpaid === "function") n += bbUnpaid().filter(b => !b.autopay && b.dueDate && daysTo(b.dueDate) <= 3).length; } catch(e){}
  return n;
}
function updateAppBadge(){
  if (!("setAppBadge" in navigator)) return;
  const n = appBadgeCount();
  try { (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch(e){}
}

async function remCheck(out, test, setup){
  const line = (ok, t) => `<div class="ck ${ok === true ? "ok" : ok === false ? "bad" : ""}"><span>${ok === true ? "✅" : ok === false ? "❌" : "ℹ️"}</span><span>${t}</span></div>`;
  if (!LOCAL.url){ out.innerHTML = line(false, "This phone isn't connected to your Google script (⚙︎ → Sync)."); return; }
  out.innerHTML = `<div class="ck">Checking…</div>`;
  await remSync();
  let r; try { r = await api({ doc:"house", key:keyFor(), op: setup ? "remSetup" : "remStatus", who:whoAmI(), test: test ? 1 : "" }); } catch(e){ out.innerHTML = line(false, "Couldn't reach your Google script. Check your internet, or the Sync link in ⚙︎."); return; }
  let h = "";
  if (!r || r.ok === false){
    if (setup && r && r.error === "unknown op"){ out.innerHTML = line(false, "Your script doesn't have the switch-on button yet. Paste the latest Code.gs and deploy a New version, then try again."); return; }
    if (r && /^setup:/.test(r.error || "")){ out.innerHTML = line(false, "Google wouldn't let the app switch it on (" + esc(r.error.slice(7)) + "). Open the script, choose <b>setupReminders</b> in the drop-down next to Run, press Run, and tap Allow."); return; }
    h += line(false, r && r.error === "unknown op" ? "Your Google script is the old version. Paste the latest Code.gs, then Deploy → Manage deployments → Edit → New version → Deploy." : "Google script error: " + esc((r && r.error) || "no reply"));
    out.innerHTML = h; return;
  }
  h += line(true, "Google script is up to date");
  const ago = r.lastRun ? RL.minsBetween(r.lastRun, r.now) : null;
  if (!r.triggers) h += line(false, `The every-minute check isn't switched on.<br><button class="rbtn" id="rChkS">⚡ Switch it on now</button>`);
  else if (ago == null || ago > 3) h += line(false, `The every-minute check is set but ${ago == null ? "has never run" : "last ran " + ago + " min ago"}. Run <b>setupReminders</b> again and allow access.`);
  else h += line(true, `Every-minute check is running (last run ${ago <= 0 ? "just now" : ago + " min ago"})`);
  if (r.lastErr) h += line(false, "Last check failed: " + esc(r.lastErr));
  if (r.engine && r.engine !== "ok") h += line(false, "Your Google script can't make notifications: " + esc(r.engine));
  h += r.pushSubs ? line(true, `Home Base notifications are on for ${r.pushSubs} phone${r.pushSubs === 1 ? "" : "s"}`) : line(false, "Home Base notifications aren't turned on yet. Tap <b>Turn on notifications</b> above.");
  h += r.open ? line(true, `${r.open} reminder${r.open === 1 ? "" : "s"} saved in Google${r.next ? ` · next: ${esc(r.next.t)}, ${remWhen(r.next.at)}` : ""}`) : line(false, "Google has no reminders saved from this phone yet.");
  if (r.log && r.log.length) h += line(null, "Last alerts sent: " + r.log.slice(0, 3).map(x => `${esc(x.t)} at ${remHM(x.at)}${x.code === 200 ? "" : " (failed: " + esc(String(x.code)) + ")"}`).join("; "));
  else h += line(null, "No alerts have been sent by the script yet.");
  if (test) h += r.test === 200 ? line(true, "Test sent from Google — it should be on your phone now.") : line(false, "Google couldn't send the test: " + esc(String(r.test)));
  else h += `<button class="rbtn ghost" id="rChkT">Send a test from Google</button>`;
  out.innerHTML = h;
  const t = out.querySelector("#rChkT"); if (t) t.onclick = () => remCheck(out, true);
  const sw = out.querySelector("#rChkS"); if (sw) sw.onclick = () => remCheck(out, false, true);
}

/* ================= Routines: checklists that reset every day ================= */
const RT_ICONS = ["☀️","🌙","💊","🏋️","🧹","📚","🧘","🐶","🍳","🚿","👔","🛏️","🙏","💧"];
const RT_TEMPLATES = {
  morning:{ name:"Morning", icon:"☀️", color:"#f59a3b", time:"07:00", steps:["Make bed","Drink water","Vitamins","Check today's reminders"] },
  evening:{ name:"Evening", icon:"🌙", color:"#6c6cf0", time:"21:00", steps:["Lock doors","Kitchen tidy","Charge phone","Set alarm"] },
  blank:{ name:"", icon:"⭐", color:"#2bb7a8", time:"", steps:[] }
};
const rtToday = () => remNow().slice(0,10);
function rtDoneSteps(r){ const x = (REM.rdone || {})[r.id]; return x && x.date === rtToday() ? (x.steps || []).filter(id => (r.steps || []).some(st => st.id === id)) : []; }
function rtActiveToday(r){ return !r.days || !r.days.length || r.days.indexOf(RL.dow(rtToday() + "T00:00")) >= 0; }
/* A routine whose time has passed today and isn't finished: shown in red until it's done. */
function rtLate(r){ return !!(r.time && rtActiveToday(r) && (r.steps || []).length && rtDoneSteps(r).length < r.steps.length && remNow() >= rtToday() + "T" + r.time); }
function rtSet(r, steps){ REM.rdone = REM.rdone || {}; REM.rdone[r.id] = { date:rtToday(), steps }; rtMark(r, steps.length >= (r.steps || []).length); REM.su = Date.now(); remSave(); }
function rtRowsHTML(){
  return (REM.routines || []).map(r => {
    const n = rtDoneSteps(r).length, t = (r.steps || []).length, on = rtActiveToday(r), all = t && n >= t, late = rtLate(r);
    return `<button class="rl rtrow ${late ? "late" : ""}" data-rt="${r.id}"><span class="rli" style="background:${r.color || "#f59a3b"}">${r.icon || "☀️"}</span><span class="rln">${esc(r.name)}${r.time ? `<small>${remHM("2000-01-01T" + r.time)}</small>` : ""}${rtStreak(r) >= 2 ? `<small class="fire">🔥${rtStreak(r)}</small>` : ""}</span>${on ? `<span class="rtbar"><i style="width:${t ? Math.round(n / t * 100) : 0}%;background:${r.color || "#f59a3b"}"></i></span><span class="rlc ${all ? "ok" : ""}">${all ? "✓" : n + "/" + t}</span>` : `<span class="rlc">Rest day</span>`}<span class="rlx">›</span></button>`;
  }).join("");
}
function rtCelebrate(r){ toast(`${r.name} done 🎉`); try { confetti(); } catch(e){} }
function openRoutine(id){

/* ---- routine streaks ---- */
const rtPrev = d => RL.addMin(d + "T00:00", -1440).slice(0,10);
function rtHist(r){ return (REM.rhist || {})[r.id] || []; }
function rtMark(r, done){
  REM.rhist = REM.rhist || {};
  const h = rtHist(r).filter(x => x !== rtToday());
  if (done) h.push(rtToday());
  REM.rhist[r.id] = h.sort().slice(-120);
}
function rtOn(r, iso){ return !r.days || !r.days.length || r.days.indexOf(RL.dow(iso + "T00:00")) >= 0; }
function rtStreak(r){
  const h = new Set(rtHist(r)); let d = rtToday(), n = 0;
  if (!h.has(d)) d = rtPrev(d);
  for (let i = 0; i < 400; i++){ if (!rtOn(r, d)){ d = rtPrev(d); continue; } if (h.has(d)){ n++; d = rtPrev(d); } else break; }
  return n;
}
function rtCalendarHTML(r){
  const h = new Set(rtHist(r)), today = rtToday(), first = [rtHist(r).slice().sort()[0], r.created].filter(Boolean).sort()[0] || today;
  // five weeks, Monday first, ending this week
  let end = today; while (RL.dow(end + "T00:00") !== 0) end = RL.addMin(end + "T00:00", 1440).slice(0,10);
  let d = end; const days = []; for (let i = 0; i < 35; i++){ days.unshift(d); d = rtPrev(d); }
  const cells = days.map(x => {
    let c = "";
    if (x > today) c = "fut"; else if (!rtOn(r, x)) c = "rest"; else if (h.has(x)) c = "done"; else if (x < today && x >= first) c = "miss";
    return `<i class="${c}${x === today ? " now" : ""}" title="${x}"></i>`;
  }).join("");
  return `<div class="rtcal"><div class="rtcalh">${["M","T","W","T","F","S","S"].map(x => `<span>${x}</span>`).join("")}</div><div class="rtcalg">${cells}</div>

}

/* ---- swipe a reminder: right = done, left = snooze 1 hour ---- */
function attachRemSwipe(root, after){
  root.querySelectorAll(".rrow").forEach(row => {
    const chk = row.querySelector("[data-rdone]"); if (!chk) return;
    const id = chk.dataset.rdone;
    let x0 = 0, y0 = 0, dx = 0, mode = null;
    row.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; mode = null; row.style.transition = "none"; }, { passive:true });
    row.addEventListener("touchmove", e => {
      const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
      if (!mode){ if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.3) mode = "h"; else if (Math.abs(my) > 10) mode = "v"; }
      if (mode === "h"){ e.preventDefault(); dx = Math.max(-140, Math.min(140, mx)); row.style.transform = `translateX(${dx}px)`;
        row.classList.toggle("sw-done", dx > 70); row.classList.toggle("sw-snz", dx < -70); }
    }, { passive:false });
    row.addEventListener("touchend", () => {
      row.style.transition = "transform .2s"; row.style.transform = "";
      const was = mode; mode = null; row.classList.remove("sw-done", "sw-snz");
      if (was !== "h") return;
      if (dx > 80){ try { navigator.vibrate && navigator.vibrate(10); } catch(_){} remDone(id); if (after) after(); }
      else if (dx < -80){
        const it = REM.items.find(x => x.id === id); if (!it) return;
        RL.snooze(it, remNow(), 60); remSave(); renderRems(); updateAppBadge(); toast("Snoozed until " + remHM(it.snooze)); if (after) after();
      }
    });
  });
}

function remLinks(text){

}
function insData(keys){

const PDF_W = {

function pdfClean(s){

function pdfWidth(s, size, bold){ const t = PDF_W[bold ? "b" : "r"]; let w = 0; for (const ch of s){ const c = ch.charCodeAt(0) - 32; w += (t[c] || 556); } return w * size / 1000; }

function PdfDoc(){
  const W = 595, H = 842, pages = []; let cur = null;
  const esc = s => pdfClean(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  const api = {
    W, H,
    page(){ cur = []; pages.push(cur); return pages.length; },
    count(){ return pages.length; },
    text(x, y, s, o = {}){
      const size = o.size || 10, bold = !!o.bold; s = pdfClean(s); if (!s) return;
      if (o.align === "right") x -= pdfWidth(s, size, bold); else if (o.align === "center") x -= pdfWidth(s, size, bold) / 2;
      cur.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${pdfRgb(o.color || "#1f2a44")} rg ${x.toFixed(2)} ${(H - y).toFixed(2)} Td (${esc(s)}) Tj ET`);
    },
    rect(x, y, w, h, color){ if (w <= 0 || h <= 0) return; cur.push(`${pdfRgb(color)} rg ${x.toFixed(2)} ${(H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    line(x1, y1, x2, y2, color, wd){ cur.push(`${pdfRgb(color || "#cfd6e6")} RG ${wd || .6} w ${x1.toFixed(2)} ${(H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(H - y2).toFixed(2)} l S`); },
    pageAt(i){ cur = pages[i]; },
    bytes(){

      const kids = [];
      objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
      objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
      pages.forEach((ops, i) => {

        objs[pn] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cn} 0 R >>`;

    }

}

  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
};
function goTab(t, after){ S.tab = t; save(); render(); document.getElementById("view").scrollTop = 0; if (after) setTimeout(after, 60); }

function renderHome(){
  const host = document.getElementById("home"); if (!host) return;
  const today = isoToday(), now = remNow();
  const open = remOpen();
  const next = open.slice(0, 3);
  const bills = (typeof bbUnpaid === "function" && !LOCAL.noBills) ? bbUnpaid().filter(b => b.dueDate && daysTo(b.dueDate) <= 7 && b.amount > 0).sort((a, b) => a.dueDate < b.dueDate ? -1 : 1) : [];
  const dates = (S.dates || []).map(dt => Object.assign({ dt }, nextOccurrence(dt))).filter(x => x.days >= 0 && x.days <= 7).sort((a, b) => a.days - b.days);
  const ym = today.slice(0,7), mo = insData([ym]), pk = insData([exShift(ym, -1)]);
  const dd = n => n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days";
  const when = it => { const a = RL.at(it), d = a.slice(0,10); return a <= now ? (d < today ? "Overdue" : "Now") : d === today ? a.slice(11,16) : fmtDate(d) + " " + a.slice(11,16); };
  host.innerHTML = `
    <div class="exc hwel"><div class="hwl"><b>Welcome back</b><span id="hDay">${new Date().toLocaleDateString("en-AU", { weekday:"long" })}</span><span id="hDate">${new Date().toLocaleDateString("en-AU", { day:"numeric", month:"long", year:"numeric" })}</span></div><div class="hclock" id="hTime">${new Date().toLocaleTimeString("en-AU", { hour:"numeric", minute:"2-digit" })}</div></div>
    <div id="today"></div><div class="divider" id="tdiv" style="display:none"></div>
    <div class="exc hcard" data-go="personal"><div class="hh"><span>⏰ Next reminders</span><em>${open.length ? open.length + " open" : "All clear"}</em></div>
      ${next.map(it => `<div class="hl ${RL.at(it) <= now ? "late" : ""}"><b>${esc(it.title || it.text || "Reminder")}</b><small>${when(it)}</small></div>`).join("") || `<div class="hl mute">Nothing coming up</div>`}
      ${open.length > 3 ? `<div class="hmore">+${open.length - 3} more</div>` : ""}</div>
    ${dates.length ? `<div class="exc hcard" data-go="personal"><div class="hh"><span>🎉 Important dates</span><em>${dates.length}</em></div>${dates.map(x => `<div class="hl"><b>${x.dt.icon || "📅"} ${esc(x.dt.name)}</b><small>${dd(x.days)}</small></div>`).join("")}</div>` : ""}
    ${bills.length ? `<div class="exc hcard" data-go="bills"><div class="hh"><span>🧾 Bills coming up</span><em>${money0(bills.reduce((s, b) => s + b.amount, 0))}</em></div>
      ${bills.map(b => `<div class="hl ${daysTo(b.dueDate) < 0 ? "late" : ""}"><b>${esc(bbProv(b.provider).name)}</b><small>${daysTo(b.dueDate) < 0 ? Math.abs(daysTo(b.dueDate)) + "d late" : dd(daysTo(b.dueDate))} · ${money(b.amount)}</small></div>`).join("")}</div>` : ""}
    <div class="exc hcard" data-go="expenses"><div class="hh"><span>📊 ${exMonthLabel(ym).split(" ")[0]} so far</span><em>${money0(mo.total)}</em></div>
      <div class="hl"><b>🧾 Bills</b><small>${money0(mo.tb)}</small></div><div class="hl"><b>💳 Expenses</b><small>${money0(mo.te)}</small></div>
      ${pk.total > 0 ? `<div class="hmore">Last month ${money0(pk.total)}</div>` : ""}</div>
    <div class="hquick"><button data-q="rem"><span>⏰</span>Reminder</button><button data-q="exp"><span>💳</span>Expense</button><button data-q="item"><span>🛒</span>List</button></div>
    <div style="height:20px"></div>`;
  host.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goTab(b.dataset.go));
  host.querySelector('[data-q="rem"]').onclick = () => goTab("personal", () => editRem(null, { list:"general" }));
  host.querySelector('[data-q="exp"]').onclick = () => { HUB = "exp"; goTab("bills", () => openExpense()); };
  host.querySelector('[data-q="item"]').onclick = () => goTab("shopping");
  renderToday();
  clearInterval(window._hClk);
  window._hClk = setInterval(() => { const t = document.getElementById("hTime"); if (!t){ clearInterval(window._hClk); return; }
    const n = new Date(); t.textContent = n.toLocaleTimeString("en-AU", { hour:"numeric", minute:"2-digit" });
    document.getElementById("hDay").textContent = n.toLocaleDateString("en-AU", { weekday:"long" }); document.getElementById("hDate").textContent = n.toLocaleDateString("en-AU", { day:"numeric", month:"long", year:"numeric" }); }, 15000);
}

function renderSettingsPage(){
  const host = document.getElementById("setpg"); if (!host) return;
  const GRP = { shopping:"L", personal:"R", bills:"H", expenses:"I", home:"N", settings:"N" };
  const sel = tab => { const g = GRP[tab], opt = ([k, t]) => `<option value="${k}" ${S.themes[tab] === k ? "selected" : ""}>${t.name}</option>`, all = Object.entries(THEMES);
    return `<select class="set-sel" data-theme="${tab}">${all.filter(([, t]) => t.g === g).map(opt).join("")}<optgroup label="More colours">${all.filter(([, t]) => t.g !== g).map(opt).join("")}</optgroup></select>`; };
  const row = (id, ic, label, sub) => `<button class="setr" id="${id}"><span class="si">${ic}</span><span class="sm"><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</span><span class="sc">›</span></button>`;
  host.innerHTML = `
    <div class="setc"><div class="sth">🎨 Appearance</div>
      <div class="sg2x"><div style="grid-column:1/-1"><div class="sl">Mode</div><select class="set-sel" id="smode"><option value="auto">Auto (follow phone)</option><option value="light" ${S.mode === "light" ? "selected" : ""}>Light</option><option value="dark" ${S.mode === "dark" ? "selected" : ""}>Dark</option></select></div><div><div class="sl">Home</div>${sel("home")}</div><div><div class="sl">Lists</div>${sel("shopping")}</div><div><div class="sl">Reminders</div>${sel("personal")}</div><div><div class="sl">Expense Hub</div>${sel("bills")}</div><div><div class="sl">Insights</div>${sel("expenses")}</div>
      <div><div class="sl">Text size</div><select class="set-sel" id="tsz"><option value="normal">Normal</option><option value="large" ${S.textSize === "large" ? "selected" : ""}>Large</option><option value="xl" ${S.textSize === "xl" ? "selected" : ""}>Extra large</option></select></div></div></div>
    <div class="setc"><div class="sth">🛒 Lists</div>
      <div class="setr plain"><span class="sm"><b>Shopping by aisle</b><small>Group items the way the shop is laid out</small></span><select class="set-sel" id="ais" style="width:90px"><option value="0">Off</option><option value="1" ${S.aisles ? "selected" : ""}>On</option></select></div>
      ${row("sList", "📝", "Manage lists", "Rename, logo, emoji, delete")}</div>
    <div class="setc"><div class="sth">⏰ Reminders</div>
      ${row("sRem", "🔔", "Alerts & notifications", LOCAL.pushOn ? "Notifications are on" : "Notifications are off on this phone")}</div>
    <div class="setc"><div class="sth">🧾 Expense Hub</div>
      ${LOCAL.noBills ? "" : `${row("sLog", "📨", "Bill emails", "See what was read from your inbox")}${row("sCsv", "⬇︎", "Export bills", "Save every bill as a CSV file")}`}
      ${row("sCsvE", "⬇︎", "Export expenses", "Save every expense as a CSV file")}</div>
    <div class="setc"><div class="sth">🔄 Sync & sharing</div>
      <div class="setr plain"><span class="sm"><small>${esc(typeof statusText === "function" ? statusText() : "")}</small></span></div>
      ${row("sSync", "🔗", "Sync settings", "Google script, this phone is S or D, share link")}</div>
    <div class="setc"><div class="sth">🔒 Security</div>${row("sLock", "🔐", "App lock", "Face ID / passcode when opening")}</div>
    <div class="setc"><div class="sth">💾 Data</div>${row("sBk", "⬇︎", "Backup", "Copy everything as text")}${row("sRs", "⬆︎", "Restore", "Paste a backup")}</div>
    <div class="setc"><div class="sth">ℹ︎ About</div>
      ${row("sSplash", "✨", "Replay opening animation", "")}
      <div class="setr plain"><span class="sm"><small>Home Base · Lists, Reminders, Expense Hub and Insights</small></span></div></div>
    <div style="height:20px"></div>`;
  const q = s => host.querySelector(s);
  host.querySelectorAll("[data-theme]").forEach(s => s.onchange = () => { const t = s.dataset.theme; S.themes[t] = s.value; if (t === "home") S.themes.settings = s.value; save(); applyTheme(); });
  q("#smode").onchange = e => { S.mode = e.target.value; save(); render(); };
  q("#tsz").onchange = e => { S.textSize = e.target.value; save(); applyTextSize(); };
  q("#ais").onchange = e => { S.aisles = e.target.value === "1"; save(); };
  q("#sList").onclick = () => goTab("shopping", () => showSettings(null));
  q("#sRem").onclick = showRemSettings;
  if (q("#sLog")) q("#sLog").onclick = bbShowLog;
  if (q("#sCsv")) q("#sCsv").onclick = () => bbExportCsv();
  q("#sCsvE").onclick = () => { const k = [...new Set((S.exp || []).map(e => (e.date || "").slice(0,7)).filter(Boolean))].sort(); if (!k.length){ toast("No expenses yet"); return; } const d = insData(k); d.items = d.items.filter(i => i.src === "exp"); insExport(k, d, "home-base-expenses.csv"); };
  q("#sSync").onclick = () => showSetup(false);
  q("#sLock").onclick = showLockSettings;
  q("#sBk").onclick = showBackup; q("#sRs").onclick = showRestore;
  q("#sSplash").onclick = () => { try { sessionStorage.removeItem("hb_splash"); } catch(e){} location.reload(); };
}

document.querySelectorAll("#tabs .tab").forEach(b => { const sv = b.querySelector("svg"); if (sv) sv.innerHTML = NAV_ICONS[b.dataset.tab] || ""; });
/* ================= sync & sharing setup ================= */
const appBase = () => location.origin + location.pathname;
const linkFor = w => appBase() + "?c=" + encodeURIComponent(encCfg(Object.assign({ u:LOCAL.url, k:LOCAL.house, w: w || LOCAL.who || "S" }, LOCAL.bbApi ? { b:{ u:LOCAL.bbApi, k:LOCAL.bbKey } } : {})));
function pinOwnLink(){
  // keep this phone's settings in the address so "Add to Home Screen" carries them over
  if (LOCAL.url && LOCAL.house){ try { history.replaceState(null, "", linkFor()); } catch(e){} }
}
function statusText(){
  if (!LOCAL.url) return "Not connected — lists stay on this phone only.";
  if (syncState.status === "err") return "⚠️ Couldn't reach your sync script: " + esc(syncState.err);
  if (syncState.status === "busy") return "Syncing…";
  if (syncState.at) return "✓ Synced " + ago2(syncState.at);
  return "Connected.";
}
function ago2(ts){ const s = Math.round((Date.now()-ts)/1000); return s < 10 ? "just now" : s < 60 ? s + "s ago" : Math.round(s/60) + " min ago"; }
async function shareLink(url, title){
  try { if (navigator.share){ await navigator.share({ title, url }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch(e){ prompt("Copy this link", url); }
}
function showSetup(first){
  menu.innerHTML = `<div class="mt">${first ? "Welcome to Home Base" : "Sync & sharing"}</div>
    <div class="note">${first ? "Connect your Google Apps Script so your lists sync between phones. You can also start without it and connect later." : statusText()}</div>
    <form class="ed" id="sf" style="padding-top:0">
      <label>Apps Script web app URL</label><input id="sUrl" value="${esc(LOCAL.url||"")}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off">
      <label>Household key</label><input id="sHouse" value="${esc(LOCAL.house||"")}" autocomplete="off" autocapitalize="off">

      <label>This phone belongs to</label><select class="set-sel" id="sWho" style="width:100%;margin:0"><option value="S">S</option><option value="D" ${LOCAL.who==="D"?"selected":""}>D</option></select>
      <div class="acts"><button type="submit" class="save">${LOCAL.url ? "Save & sync" : "Connect"}</button></div>
    </form>
    ${LOCAL.url
      ? `<div class="acts2"><button id="sNow">🔄 Sync now</button><button id="sWife">👩 Send invite link</button></div>
         <div class="acts2" style="padding-top:0"><button id="sMine">📲 My app link</button><button id="sOff" class="danger">Disconnect</button></div>`
      : `<div class="acts2"><button id="sSkip" style="grid-column:span 2">Use without sync for now</button></div>`}
    ${first ? "" : `<button class="sdone" id="cx">Done</button>`}`;
  menu.querySelector("#sf").onsubmit = e => {
    e.preventDefault();
    const url = menu.querySelector("#sUrl").value.trim(), house = menu.querySelector("#sHouse").value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast("Paste the Apps Script /exec URL"); return; }
    if (!house){ toast("Enter the household key"); return; }
    const changed = url !== LOCAL.url || house !== LOCAL.house;
    const bbEl = menu.querySelector("#sBB"), bbTxt = bbEl ? bbEl.value.trim() : "";
    if (bbTxt){ const bc = parseBillBellLink(bbTxt); if (!bc){ toast("That BillBell link doesn't look right"); return; } LOCAL.bbApi = bc.api; LOCAL.bbKey = bc.key; setTimeout(() => billsRefresh(false), 300); }
    LOCAL.url = url; LOCAL.house = house; LOCAL.offline = false; LOCAL.who = menu.querySelector("#sWho").value; LOCAL.whoSet = 1;
    if (changed){ LOCAL.synced = false; LOCAL.hVer = 0; }
    saveLocal(); pinOwnLink(); closeMenu(); render(); toast("Connecting…");
    syncNow().then(() => toast(syncState.status === "ok" ? "Synced ✓" : "Couldn't connect — check the URL and key"));
  };
  const q = id => menu.querySelector(id);
  if (q("#sNow")) q("#sNow").onclick = async () => { await syncNow(); showSetup(false); };
  if (q("#sWife")) q("#sWife").onclick = () => shareLink(linkFor(LOCAL.who === "D" ? "S" : "D"), "Home Base");
  if (q("#sMine")) q("#sMine").onclick = () => shareLink(linkFor(), "Home Base");
  if (q("#sOff")) q("#sOff").onclick = () => { LOCAL.url = ""; LOCAL.synced = false; saveLocal(); try{ history.replaceState(null, "", appBase()); }catch(e){} setSync("off"); showSetup(false); toast("Disconnected — lists stay on this phone"); };
  if (q("#sSkip")) q("#sSkip").onclick = () => { LOCAL.offline = true; saveLocal(); closeMenu(); };
  if (q("#cx")) q("#cx").onclick = closeMenu;
  openMenu();
}
async function sendList(c){
  const open = c.items.filter(x=>!x.done);
  const text = c.title + "\n" + (open.length ? open : c.items).map(x => "• " + x.text + ((x.qty||1) > 1 ? " ×" + x.qty : "")).join("\n");
  try { if (navigator.share){ await navigator.share({ text }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("List copied"); } catch(e){ toast("Couldn't copy"); }
}
document.getElementById("syncDot").onclick = () => showSetup(false);
pinOwnLink();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ================= tabs ================= */
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  S.tab = b.dataset.tab; save(); render(); document.getElementById("view").scrollTop = 0;
};
render();
</script>
